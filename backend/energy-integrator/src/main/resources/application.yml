server:
  port: 8081

spring:
  application:
    name: energy-integrator
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/energyequitygrid}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 600000
      max-lifetime: 1800000
      connection-timeout: 20000
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB

jwt:
  secret: ${JWT_SECRET:#{null}}
  # NIST AC-12: 4-hour access token lifetime
  expiration: ${JWT_EXPIRATION:14400000}

app:
  cors:
    allowed-origins: ${ALLOWED_ORIGINS:http://localhost:3000}
  ai:
    predictor-url: ${AI_PREDICTOR_URL:http://localhost:8083}
    llm-url: ${AI_LLM_URL:http://localhost:8084}
  collaboration:
    websocket-path: ${COLLAB_WEBSOCKET_PATH:/ws/collaborate}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  metrics:
    export:
      prometheus:
        enabled: true
