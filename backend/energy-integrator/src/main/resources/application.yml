server:
  port: 8081

spring:
  application:
    name: energy-integrator
  datasource:
    url: jdbc:postgresql://localhost:5432/energyequitygrid
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB

jwt:
  secret: EnergyEquityGrid2025SecretKeyForJWTAuthenticationAndAuthorization
  expiration: 86400000

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  metrics:
    export:
      prometheus:
        enabled: true
