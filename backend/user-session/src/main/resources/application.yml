server:
  port: 8082

spring:
  application:
    name: user-session
  datasource:
    url: jdbc:postgresql://localhost:5432/energyequitygrid
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  redis:
    host: localhost
    port: 6379
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:your-google-client-id}
            client-secret: ${GOOGLE_CLIENT_SECRET:your-google-client-secret}
            scope: openid,profile,email
          azure:
            client-id: ${AZURE_CLIENT_ID:your-azure-client-id}
            client-secret: ${AZURE_CLIENT_SECRET:your-azure-client-secret}
            scope: openid,profile,email
            authorization-grant-type: authorization_code
          okta:
            client-id: ${OKTA_CLIENT_ID:your-okta-client-id}
            client-secret: ${OKTA_CLIENT_SECRET:your-okta-client-secret}
            scope: openid,profile,email

jwt:
  secret: EnergyEquityGrid2025SecretKeyForJWTAuthenticationAndAuthorization
  expiration: 86400000
  refresh-expiration: 604800000

mfa:
  enabled: true
  issuer: EnergyEquityGrid

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
