server:
  port: 8082

spring:
  application:
    name: user-session
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/energyequitygrid}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 600000
      max-lifetime: 1800000
      connection-timeout: 20000
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  redis:
    host: ${SPRING_REDIS_HOST:localhost}
    port: ${SPRING_REDIS_PORT:6379}
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:your-google-client-id}
            client-secret: ${GOOGLE_CLIENT_SECRET:your-google-client-secret}
            scope: openid,profile,email
          azure:
            client-id: ${AZURE_CLIENT_ID:your-azure-client-id}
            client-secret: ${AZURE_CLIENT_SECRET:your-azure-client-secret}
            scope: openid,profile,email
            authorization-grant-type: authorization_code
          okta:
            client-id: ${OKTA_CLIENT_ID:your-okta-client-id}
            client-secret: ${OKTA_CLIENT_SECRET:your-okta-client-secret}
            scope: openid,profile,email

jwt:
  secret: ${JWT_SECRET:#{null}}
  # NIST AC-12: Session timeout — 4 hours for access tokens (was 24h)
  expiration: ${JWT_EXPIRATION:14400000}
  # NIST AC-12: Refresh tokens valid for 24 hours (was 7 days)
  refresh-expiration: ${JWT_REFRESH_EXPIRATION:86400000}

mfa:
  enabled: true
  issuer: ${MFA_ISSUER:EnergyEquityGrid}

app:
  cors:
    allowed-origins: ${ALLOWED_ORIGINS:http://localhost:3000}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
